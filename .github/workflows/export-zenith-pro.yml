name: Generate Zenith Pro import ZIP
on:
  push:
    paths:
      - '.github/workflows/export-zenith-pro.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source files and generate ZIP
        run: |
          set -euo pipefail
          test -f zenith-prospecta-pro/index.html
          test -f zenith-prospecta-pro/package.json
          mkdir -p _zenith_import
          cp zenith-prospecta-pro/index.html _zenith_import/index.html
          cp zenith-prospecta-pro/package.json _zenith_import/package.json
          cd _zenith_import
          zip -9 -q ../zenith-prospecta-pro-import.zip index.html package.json
      - name: Commit ZIP to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zenith-prospecta-pro-import.zip
          if ! git diff --cached --quiet; then
            git commit -m "Build: arquivo ZIP para importar Zenith Pro no Lovable"
            git push
          fi
